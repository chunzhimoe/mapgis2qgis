name: Build macOS arm64 offline DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install '.[spatial]'
      - run: python -m unittest discover -s tests -v
      - name: Ensure local archives are absent
        run: test -z "$(git ls-files changes)"

  macos-arm64:
    needs: tests
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          activate-environment: builder
          python-version: '3.11'
          channels: conda-forge
          channel-priority: strict
      - name: Install build tools
        run: conda install -y -c conda-forge constructor conda-standalone setuptools wheel
      - name: Build full offline installer and DMG
        run: python tools/build_desktop.py
      - name: Install PKG and test the installed runtime
        run: |
          sudo installer -pkg dist/installers/MapGIS2QGIS-0.4.0-macOS-arm64.pkg -target /
          /Applications/MapGIS2QGIS-0.4.0/bin/python tests/installed_runtime_smoke.py dist/installers/installed-runtime.json
          /Applications/MapGIS2QGIS-0.4.0/bin/python tests/gui_smoke.py dist/installers/installed-gui.json
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-verification
          path: |
            dist/installers/*.json
            dist/installers/*.txt
          retention-days: 7
      - name: Save installer as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" dist/installers/*.dmg dist/installers/SHA256SUMS.txt dist/installers/build.json dist/installers/installed-runtime.json dist/installers/installed-gui.json --draft --target "$GITHUB_SHA" --title 'MapGIS2QGIS 0.4.0 macOS arm64' --notes 'Offline installer containing Python, Tk, conversion library and QGIS. Unsigned development build. See attached runtime and GUI verification reports.'
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
