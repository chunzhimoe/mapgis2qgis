[metadata]
name = mapgis-annotations
version = 0.4.2
description = Native MapGIS 6.x to Shapefile conversion plus auditable annotation conversion and layout
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT AND Apache-2.0 AND OFL-1.1
license_files =
    LICENSE
    THIRD_PARTY_NOTICES.md
    licenses/Apache-2.0.txt
    licenses/SIL-OFL-1.1.txt

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    pyshp>=2.3,<4

[options.packages.find]
where = src

[options.package_data]
mapgis_annotations =
    profiles/*.json
    fonts/*.otf
    fonts/*.txt

[options.extras_require]
spatial =
    shapely>=2,<3
    pyproj>=3.4,<4

[options.entry_points]
console_scripts =
    mapgis-annotations = mapgis_annotations.cli:main
